# Host nginx vhost — proxies adamlevs.com → portfolio container on :7777
# Enable: sudo ln -sf /home/adam/Portfolio/deploy/adamlevs.com.conf /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
#
# Add more apps the same way: new file in sites-available → proxy to their port.

server {
    listen 80;
    listen [::]:80;
    server_name adamlevs.com www.adamlevs.com;

    location / {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
